x-feast-common:
  &feast-common
  build: .
  environment:
    POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
  depends_on:
    &feast-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:?POSTGRES_USER must be set}", "-d", "${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    volumes:
      - redis-data:/data

  feast-init:
    <<: *feast-common
    command: feast apply
    restart: "no"

  feast:
    <<: *feast-common
    command: feast serve --host 0.0.0.0 --port 6566
    ports:
      - "127.0.0.1:${FEAST_PORT:-6566}:6566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6566/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      <<: *feast-common-depends-on
      feast-init:
        condition: service_completed_successfully

  feast-ui:
    <<: *feast-common
    command: feast ui --host 0.0.0.0 --port 8888
    ports:
      - "127.0.0.1:${FEAST_UI_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      <<: *feast-common-depends-on
      feast-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
