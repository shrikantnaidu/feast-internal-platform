x-feast-common:
  &feast-common
  build: .
  depends_on:
    &feast-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  feast-init:
    <<: *feast-common
    command: feast apply
    restart: "no"

  feast:
    <<: *feast-common
    command: feast serve --host 0.0.0.0 --port 6566
    ports:
      - "${FEAST_PORT:-6566}:6566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6566/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      <<: *feast-common-depends-on
      feast-init:
        condition: service_completed_successfully

  feast-ui:
    <<: *feast-common
    command: feast ui --host 0.0.0.0 --port 8888
    ports:
      - "${FEAST_UI_PORT:-8888}:8888"
    restart: always
    depends_on:
      <<: *feast-common-depends-on
      feast-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
